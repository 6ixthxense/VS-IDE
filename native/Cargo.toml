[workspace]
resolver = "2"
members = [
  "crates/app",
  "crates/core",
  "crates/fs_index",
  "crates/search",
  "crates/tasks",
  "crates/terminal",
  "crates/git",
  "crates/db",
  "crates/sysmon",
  "crates/lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.dev]
# Keep debug builds usable: optimize dependencies, keep our own code fast to compile.
opt-level = 0
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
