[package]
name = "vsm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vs-monitor"
path = "src/main.rs"

[dependencies]
gpui-component = { version = "0.7.3", features = [
  "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-python",
  "tree-sitter-rust", "tree-sitter-markdown", "tree-sitter-toml", "tree-sitter-yaml",
  "tree-sitter-html", "tree-sitter-css", "tree-sitter-bash", "tree-sitter-go",
  "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-sql",
] }
gpui = { package = "gpui-pre", version = "=0.3.9" }
anyhow = "1"
serde_json = "1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland"] }
gpui-kit-assets = "0.7.3"
vsm-core = { path = "../core" }
vsm-search = { path = "../search" }
vsm-fs_index = { path = "../fs_index" }

[dev-dependencies]
tempfile = "3"
